<!doctype html>
<html lang="de">
<head>
<script src="lgh-vorlade.js"></script><!--lgh-->

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Derp RNG</title>
<meta name="description" content="Würfle Auren, sammle sie alle und finde den DERP-GOTT. Ein ziemlich alberner Glücksspiel-Sammler.">
<meta name="theme-color" content="#120d28">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Derp RNG">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="weather" aria-hidden="true"></canvas>
<div id="app">
  <header id="top">
    <div class="reserve" aria-hidden="true"></div>
    <div class="title">DERP <b>RNG</b></div>
    <div class="right">
      <div class="pill" id="coins" title="Derp-Taler"><span class="ic" id="coin-ic"></span><span id="coin-n">0</span></div>
      <button class="iconbtn" id="btn-settings" aria-label="Einstellungen"></button>
    </div>
  </header>

  <main id="stage">
    <canvas id="stagecv"></canvas>
    <div id="weather-chip"><span class="dot"></span><span id="w-name">Derp-Wiese</span><span id="w-time" class="mono">4:00</span></div>
    <div id="w-text"></div>
    <div id="feed" aria-live="polite"></div>
    <div id="banner"><span id="banner-tier"></span><b id="banner-name"></b></div>
    <div id="aura-info">
      <div id="aura-tier" class="chip">Gewöhnlich</div>
      <div id="aura-name">Gar nix</div>
      <div id="aura-odds">Würfle deine erste Aura!</div>
    </div>
    <div id="flash"></div>
    <div id="floats"></div>
  </main>

  <section id="controls">
    <div id="chips"></div>
    <div class="rollrow">
      <button class="side" id="btn-auto" aria-pressed="false"><span class="ic" id="auto-ic"></span><span class="lbl">Auto</span></button>
      <button id="btn-roll" aria-label="Würfeln">
        <span class="ring"></span><span class="face"><span class="ic" id="roll-ic"></span><span class="lbl">WÜRFELN</span></span>
      </button>
      <button class="side" id="btn-multi"><span class="big" id="multi-n">×1</span><span class="lbl">Würfe</span></button>
    </div>
    <div id="cd-text" class="mono"></div>
  </section>

  <nav id="tabs">
    <button data-tab="coll"><span class="ic"></span><span class="lbl">Sammlung</span><i class="badge" hidden></i></button>
    <button data-tab="shop"><span class="ic"></span><span class="lbl">Shop</span></button>
    <button data-tab="lab"><span class="ic"></span><span class="lbl">Labor</span></button>
    <button data-tab="ach"><span class="ic"></span><span class="lbl">Erfolge</span><i class="badge" hidden></i></button>
  </nav>

  <section id="sheet" hidden>
    <div class="sheet-head"><h2 id="sheet-title"></h2><span id="sheet-sub"></span><button class="iconbtn" id="sheet-close" aria-label="Schließen"></button></div>
    <div id="sheet-body"></div>
  </section>
</div>

<div id="modal" hidden><div class="box" id="modal-box"></div></div>

<div id="kino" hidden>
  <canvas id="kinocv"></canvas>
  <div class="bars"><i></i><i></i></div>
  <div class="k-flash"></div>
  <div class="k-text">
    <div class="k-new">NEUE AURA!</div>
    <div class="k-tier">LEGENDÄR</div>
    <div class="k-name">Name</div>
    <div class="k-odds">1 zu 1</div>
    <div class="k-desc"></div>
    <div class="k-gain"></div>
    <div class="k-hint">Tippen zum Weitermachen</div>
  </div>
  <div class="k-dots">…</div>
</div>
<div id="splash"><div class="sp-glow"></div><img class="sp-logo" src="favicon.svg" alt=""><div class="sp-title">DERP <b>RNG</b></div><div class="sp-sub">Würfle. Sammle. Derpe.</div><div class="sp-bar"><i></i></div><div class="sp-hint">Tippen zum Starten</div></div>
<div id="toasts" aria-live="polite"></div>

<script src="js/util.js"></script>
<script src="js/data.js"></script>
<script src="js/derp.js"></script>
<script src="js/fx.js"></script>
<script src="js/audio.js"></script>
<script src="js/game.js"></script>
<!--lgh-start--><script>window.LGH_SPIEL='aurarng';window.LGH_POS='bc';window.LGH_EIGENER_KNOPF=true;</script><script src="lgh-modul.js"></script><!--lgh-ende-->
</body>
</html>
